# Cap the graph quantum at 512 samples (~10.7 ms @ 48 kHz) to trim buffer
# latency for the DeepFilterNet mic chain (see 99-deepfilter-source.conf).
# default = baseline size; max caps it so no app pushes the graph back to 1024.
# min stays low so latency-sensitive apps can still request smaller.
context.properties = {
    default.clock.quantum     = 512
    default.clock.max-quantum = 512
}
