# DeepFilterNet real-time speech enhancement (denoise + dereverb) as a
# native PipeWire virtual source. No EasyEffects / NoiseTorch needed.
# Plugin: libdeep_filter_ladspa-bin  (label: deep_filter_mono)
# Applied on `systemctl --user restart pipewire pipewire-pulse`.
context.modules = [
  { name = libpipewire-module-filter-chain
    flags = [ nofail ]
    args = {
      node.description = "DeepFilter Noise Canceling Source"
      media.name       = "DeepFilter Noise Canceling Source"

      # Two-stage chain:
      #   1. DeepFilterNet -> removes room reverb + primary noise
      #   2. RNNoise (werman) -> aggressive VAD gate that nukes residual
      #      keyboard/AC/hiss the way NoiseTorch used to.
      filter.graph = {
        nodes = [
          {
            type   = ladspa
            name   = deep_filter
            plugin = "/usr/lib/ladspa/libdeep_filter_ladspa.so"
            label  = "deep_filter_mono"
            control = {
              # 0-100, higher = more aggressive noise/reverb attenuation.
              # Lower to ~60-80 if voice starts sounding processed.
              "Attenuation Limit (dB)" = 100
              # small post-filter reduces residual musical noise
              "Post Filter Beta" = 0.02
            }
          }
          {
            type   = ladspa
            name   = rnnoise
            plugin = "/usr/lib/ladspa/librnnoise_ladspa.so"
            label  = "noise_suppressor_mono"
            control = {
              # 0-99, higher = more aggressive gating (kills more noise;
              # too high can clip quiet speech onsets). Lower if it eats words.
              "VAD Threshold (%)" = 90
              # close the gate quickly after speech so pauses go silent
              "VAD Grace Period (ms)" = 200
            }
          }
        ]
        links = [
          { output = "deep_filter:Audio Out", input = "rnnoise:Input" }
        ]
      }

      audio.rate = 48000

      # Pull straight from the HyperX hardware mic (downmixed to mono),
      # bound explicitly so it never follows / loops the default source.
      capture.props = {
        node.name      = "capture.deepfilter_source"
        node.passive   = true
        audio.rate     = 48000
        audio.channels = 1
        audio.position = [ MONO ]
        target.object  = "alsa_input.usb-HP__Inc_HyperX_SoloCast-00.iec958-stereo"
      }

      # The virtual source apps (Discord) record from.
      # priority.session is set well above every hardware source
      # (HyperX ~2108, Creative ~2100, bluetooth ~1000) so that when a
      # new input device is hotplugged and WirePlumber re-picks the
      # default source, this virtual node always wins and stays default.
      playback.props = {
        node.name        = "deepfilter_source"
        media.class      = Audio/Source
        audio.rate       = 48000
        audio.channels   = 1
        audio.position   = [ MONO ]
        priority.session = 3000
      }
    }
  }
]
